# A tag vX.Y.Z publishes that version to PyPI, where the installer (dyeroom.app/install.sh) and
# `uv tool upgrade dyeroom` find it. PyPI trusts this workflow directly (trusted publishing):
# no token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip install build && python -m build --wheel
      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
