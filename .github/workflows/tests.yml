name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}  # Windows support is being worked on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ExifTool (metadata tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: ExifTool (metadata tests)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install
        run: python -m pip install -e ".[web,colourise,test]"
      - name: Test
        run: python -m unittest discover -s tests -v
